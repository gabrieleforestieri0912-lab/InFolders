<!DOCTYPE html>
<html lang="it">

<head>
  <meta charset="UTF-8">
  <title>InFolders</title>
  <link rel="stylesheet" href="popup.css">
</head>

<body>
  <div id="app">
    <h1>InFolders</h1>

    <div id="auth-section">
      <button id="login-btn">Accedi con Google</button>
      <button id="logout-btn" style="display:none;">Logout</button>
      <div id="user-info" style="display:none;"></div>
    </div>

    <!-- Richer Account Section -->
    <div id="account-section" style="display:none;">
      <div id="account-card">
        <div id="avatar-container">
          <img id="avatar-img" src="" alt="Avatar" />
        </div>
        <div id="account-details">
          <span id="account-name"></span>
          <span id="account-email"></span>
        </div>
      </div>
      <div id="account-stats">
        <div class="stat-card">
          <span class="stat-icon">📁</span>
          <span class="stat-value" id="stat-folders">0</span>
          <span class="stat-label">Cartelle</span>
        </div>
        <div class="stat-card">
          <span class="stat-icon">💬</span>
          <span class="stat-value" id="stat-chats">0</span>
          <span class="stat-label">Chat</span>
        </div>
        <div class="stat-card">
          <span class="stat-icon">⭐</span>
          <span class="stat-value" id="stat-plan">Free</span>
          <span class="stat-label">Piano</span>
        </div>
      </div>
    </div>

    <div id="folders-section" style="display:none;">
      <div id="folders-header">
        <span id="folders-title">Folders</span>
        <button id="add-root-folder" title="Nuova cartella" aria-label="Nuova cartella">
          <span id="add-root-icon">+</span>
        </button>
      </div>

      <div id="folders-search-wrapper">
        <span id="folders-search-icon">
          <svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
        </span>
        <input type="search" id="folders-search" placeholder="Cerca cartelle..." autocomplete="off" />
      </div>

      <div id="folders-container"></div>
    </div>

    <div id="backup-section"
      style="display:none; margin-top: 15px; padding-top: 15px; border-top: 1px solid rgba(124, 58, 237, 0.2);">
      <button id="export-btn">Esporta Backup</button>
      <button id="import-btn">Importa Backup</button>
    </div>
  </div>

  <script src="lucide-icons.js"></script>
  <script src="popup.js"></script>
</body>

</html>
